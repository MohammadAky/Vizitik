# ============================================================================
#  Vizitik - Render Blueprint
# ============================================================================
#  Render Dashboard → New → Blueprint → connect this repo.
#  Three services are created:
#    vizitik-app      Node Web Service: NestJS API + the built PWA (same origin)
#    vizitik-admin    Node Web Service: admin SQL/catalog panel
#    vizitik-landing  Static Site: landing page (free)
#
#  DATABASE_URL is NOT in this file on purpose - set it in the Render
#  dashboard (each service: Environment tab). It must match the provider
#  of backend/prisma/schema.prisma (currently MySQL):
#    mysql://user:password@HOST:3306/vizitik_db
#  The app's build runs `prisma db push`, so the schema is created in the
#  database automatically on the first deploy.
# ============================================================================
services:
  # --------------------------------------------------------------------------
  # 1) main service: API + PWA from one origin
  #    /            → PWA (SPA, offline-first)
  #    /api/*       → NestJS API
  # --------------------------------------------------------------------------
  - type: web
    name: vizitik-app
    runtime: node
    plan: free               # always-on? use: starter (~$7/mo)
    buildCommand: |
      cd frontend-app && npm install --no-audit --no-fund --production=false && npm run build &&
      cd ../backend && npm install --no-audit --no-fund --production=false && npx prisma generate &&
      npx prisma db push && npm run build
    startCommand: cd backend && node dist/main.js
    healthCheckPath: /
    envVars:
      # match the tested environment (vite/bcrypt prebuilds, prisma CLI)
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      # database connection - set manually in the dashboard (required):
      - key: DATABASE_URL
        sync: false
      # Bale bot (optional - the bot stays silent while these are empty):
      - key: BALE_BOT_USERNAME
        sync: false
      - key: BALE_BOT_TOKEN
        sync: false
      - key: BALE_ADMIN_CHAT_ID
        sync: false

  # --------------------------------------------------------------------------
  # 2) admin panel (SQL queries, product catalog, users, customers)
  #    build: generates the Prisma client from the backend schema and copies
  #    it into this service's node_modules (same schema, same versions)
  # --------------------------------------------------------------------------
  - type: web
    name: vizitik-admin
    runtime: node
    rootDir: admin
    plan: free               # always-on? use: starter
    buildCommand: |
      cd .. &&
      (cd backend && npm install --no-audit --no-fund --production=false && npx prisma generate) &&
      cd admin && npm install --no-audit --no-fund --production=false &&
      rm -rf node_modules/@prisma/client node_modules/.prisma &&
      cp -r ../backend/node_modules/@prisma/client node_modules/@prisma/client &&
      cp -r ../backend/node_modules/.prisma node_modules/.prisma
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # the panel refuses to start without it - Render generates a strong one:
      - key: ADMIN_TOKEN
        generateValue: true
      # same database as the app service:
      - key: DATABASE_URL
        sync: false

  # --------------------------------------------------------------------------
  # 3) landing page (static - free)
  #    static sites in a Blueprint are: type: web + runtime: static +
  #    staticPublishPath. No build step needed.
  #
  #    Two gotchas that make the deploy fail with "publish directory not found":
  #      * staticPublishPath is resolved relative to rootDir when rootDir is
  #        set (Render docs, Monorepo Support), so `rootDir: landing` +
  #        `staticPublishPath: landing` points at landing/landing and fails.
  #        That is why this service sets no rootDir and spells the publish
  #        directory relative to the repo root.
  #      * `buildCommand: true` (unquoted) is a YAML boolean, and Render
  #        validates the field as a string. Keep the quotes.
  #    before deploying, edit appUrl in landing/js/config.js to your app domain
  # --------------------------------------------------------------------------
  - type: web
    name: vizitik-landing
    runtime: static
    buildCommand: 'true'
    staticPublishPath: ./landing
